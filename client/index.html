<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bonzaa</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&display=swap">
<link rel="stylesheet" href="main.css">
<script src="https://static.zohocdn.com/catalyst/sdk/js/4.6.1/catalystWebSDK.js"></script>
<script src="/__catalyst/sdk/init.js"></script>
</head>
<body>

<!-- Auth gate: shown until the visitor is signed in -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-brand">🐾 Bonzaa</div>
    <div class="auth-tagline" id="authTagline">Puppy meals, morning to night</div>
    <div class="auth-status" id="authStatus">…</div>
    <div id="login-container" class="auth-widget"></div>
    <form id="signup-container" class="auth-form" hidden autocomplete="on">
      <div class="field"><label for="su-first" id="su-first-l">First name</label><input id="su-first" name="given-name" autocomplete="given-name" required></div>
      <div class="field"><label for="su-last" id="su-last-l">Last name</label><input id="su-last" name="family-name" autocomplete="family-name"></div>
      <div class="field"><label for="su-email" id="su-email-l">Email</label><input id="su-email" name="email" type="email" autocomplete="email" required></div>
      <button class="cta" id="su-submit" type="submit">Create account</button>
      <div class="auth-msg" id="su-msg"></div>
    </form>
    <button class="auth-switch" id="authSwitch" hidden></button>
    <button class="lang-btn auth-lang" id="authLangBtn">தமிழ்</button>
  </div>
</div>

<!-- Household gate: shown when signed in but not in a family yet -->
<div class="auth-screen" id="householdScreen" hidden>
  <div class="auth-card">
    <div class="auth-brand">👨‍👩‍👧 Bonzaa</div>
    <div class="auth-tagline" id="hhTagline">One family, one shared list of puppies</div>
    <div class="auth-status" id="hhStatus"></div>

    <form id="hh-create-form" class="auth-form" autocomplete="off">
      <div class="field"><label for="hh-name" id="hh-name-l">Family name</label><input id="hh-name" required placeholder="e.g. Durgaraj Family"></div>
      <button class="cta" id="hh-create-submit" type="submit">Create family</button>
    </form>
    <form id="hh-join-form" class="auth-form" hidden autocomplete="off">
      <div class="field"><label for="hh-code" id="hh-code-l">Invite code</label><input id="hh-code" required placeholder="e.g. PUP7X2QK" maxlength="8" style="text-transform:uppercase"></div>
      <button class="cta" id="hh-join-submit" type="submit">Join family</button>
    </form>
    <div class="auth-msg" id="hh-msg"></div>

    <button class="auth-switch" id="hhSwitch"></button>
    <button class="lang-btn auth-lang" id="hhLangBtn">தமிழ்</button>
  </div>
</div>

<!-- App shell: revealed once authenticated and in a family -->
<div id="appShell" hidden>
  <header class="topbar">
    <div>
      <div class="brand">🐾 Bonzaa</div>
      <div class="brand-sub" id="topbarSub">Daily meals</div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="familyBtn" aria-label="Family">👨‍👩‍👧</button>
      <button class="lang-btn" id="langBtn" aria-label="Switch language">தமிழ்</button>
      <button class="icon-btn" id="signOutBtn" aria-label="Sign out">⏻</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <button class="fab" id="fab" aria-label="Add">+</button>

  <nav class="navbar">
    <button class="nav-item sel" data-tab="today"><span class="ico">🏠</span><span class="nav-label">Today</span></button>
    <button class="nav-item" data-tab="foods"><span class="ico">🍽️</span><span class="nav-label">Foods</span></button>
    <button class="nav-item" data-tab="insights"><span class="ico">❤️</span><span class="nav-label">Insights</span></button>
    <button class="nav-item" data-tab="puppies"><span class="ico">🐾</span><span class="nav-label">Puppies</span></button>
  </nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="loader" id="loader" hidden></div>

<script src="main.js"></script>
</body>
</html>
